<form id="contactForm">
    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
    >

    <textarea
        id="message"
        placeholder="Type your message"
        required
    ></textarea>

    <button type="submit">Send Message</button>

    <p id="status"></p>
</form>

<script src="script.js"></script>
