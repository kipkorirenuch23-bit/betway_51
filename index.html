<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betway Three</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Betway Three</h1>
    <p>Phone Number & Message Notification</p>

    <form id="messageForm">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter phone number"
        required
      >

      <label for="message">Your Message</label>
      <textarea
        id="message"
        placeholder="Type your message"
        required
      ></textarea>

      <p class="notice">
        Your phone number and message will be sent to our Telegram notification bot.
      </p>

      <button type="submit">Submit</button>
    </form>

    <p id="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
